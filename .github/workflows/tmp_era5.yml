name: TEMP descargar ERA5 Bordenave

on:
  push:
    branches: [tmp-era5-desfase]

permissions:
  contents: write

jobs:
  era5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pandas
      - name: Descargar ERA5 y ERA5-Land diarios
        run: |
          python - <<'PY'
          import time, requests, pandas as pd
          from pathlib import Path
          out = []
          puntos = {"NH0343": (-37.85, -63.02), "A872817": (-37.75, -63.083332)}
          for modelo in ["era5", "era5_land"]:
              for est, (lat, lon) in puntos.items():
                  for a, b in [("1976-11-01", "1996-12-31"), ("1997-01-01", "2016-12-31"), ("2017-01-01", "2026-10-28")]:
                      p = dict(latitude=lat, longitude=lon, start_date=a, end_date=b, models=modelo,
                               daily="temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum",
                               timezone="America/Argentina/Buenos_Aires")
                      for k in range(5):
                          r = requests.get("https://archive-api.open-meteo.com/v1/archive", params=p, timeout=120)
                          if r.status_code == 200:
                              break
                          time.sleep(20 * (k + 1))
                      r.raise_for_status()
                      j = r.json()
                      d = pd.DataFrame(j["daily"]); d["modelo"] = modelo; d["punto"] = est
                      d["lat_grilla"] = j.get("latitude"); d["lon_grilla"] = j.get("longitude")
                      out.append(d); time.sleep(3)
          D = pd.concat(out)
          Path("era5").mkdir(exist_ok=True)
          D.to_csv("era5/era5_bordenave.csv", index=False)
          print(D.groupby(["modelo", "punto"]).agg(n=("time", "size"), lat=("lat_grilla", "first"), lon=("lon_grilla", "first")))
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add era5/era5_bordenave.csv
          git commit -m "ERA5 Bordenave (temporal)"
          git push origin HEAD:tmp-era5-desfase
