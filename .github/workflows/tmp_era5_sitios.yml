name: TEMP juntar ERA5 localidades Lolium

on:
  push:
    branches: [tmp-era5-desfase]

permissions:
  contents: write
  actions: read

jobs:
  juntar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42049293022
          github-token: ${{ github.token }}
          path: bajado
      - run: |
          mkdir -p era5 && python3 - <<'PY'
          import glob, pandas as pd
          d = pd.concat([pd.read_csv(f) for f in glob.glob("bajado/*/era5_*.csv")]).drop_duplicates(["sitio", "time"])
          d.to_csv("era5/era5_sitios_1991_2026.csv", index=False); print(d.groupby("sitio").time.agg(["min", "max", "count"]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add era5/era5_sitios_1991_2026.csv && git commit -m "ERA5 localidades Lolium 1991-2026 (temporal)" && git push origin HEAD:tmp-era5-desfase
