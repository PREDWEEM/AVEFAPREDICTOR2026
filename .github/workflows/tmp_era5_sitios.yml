name: TEMP descargar ERA5 localidades Lolium

on:
  push:
    branches: [tmp-era5-desfase]

permissions:
  contents: read

jobs:
  era5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sitio: ["Bordenave", "Lartigau", "Tres Arroyos", "Azul", "Olavarria", "Balcarce", "Pergamino", "San Pedro"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pandas
      - name: Descargar ERA5 diario 1991-2026
        continue-on-error: true
        env:
          SITIO: ${{ matrix.sitio }}
        run: |
          mkdir -p salida
          python - <<'PY' 2>&1 | tee "salida/log_${SITIO// /_}.txt"
          import os, time, requests, pandas as pd
          sitios = {"Bordenave": (-37.85, -63.02), "Lartigau": (-38.6166, -61.70), "Tres Arroyos": (-38.45, -60.2763),
                    "Azul": (-36.87, -59.89), "Olavarria": (-36.8799, -60.2160), "Balcarce": (-37.7664, -58.2999),
                    "Pergamino": (-33.9443, -60.5745), "San Pedro": (-33.7328, -59.7965)}
          s = os.environ["SITIO"]; lat, lon = sitios[s]
          prev = pd.read_csv("era5/era5_sitios.csv"); prev = prev[prev.sitio == s]
          hechos = set(prev["time"].astype(str).str[:4]); out = [prev]
          f = f"salida/era5_{s.replace(' ', '_')}.csv"; t0 = time.time()
          for y in range(1991, 2027):
              if str(y) in hechos or time.time() - t0 > 3000: continue
              p = dict(latitude=lat, longitude=lon, start_date=f"{y}-01-01", end_date=(f"{y}-12-31" if y < 2026 else "2026-10-28"),
                       models="era5", daily="temperature_2m_max,temperature_2m_min", timezone="America/Argentina/Buenos_Aires")
              d = None
              for intento in range(6):
                  try:
                      r = requests.get("https://archive-api.open-meteo.com/v1/archive", params=p, timeout=90)
                      if r.status_code == 200: d = pd.DataFrame(r.json()["daily"]); break
                      print("estado", s, y, r.status_code, flush=True)
                  except Exception as e:
                      print("error", s, y, type(e).__name__, flush=True)
                  time.sleep(15 * (intento + 1))
              if d is None: continue
              d["sitio"] = s; out.append(d); print("ok", s, y, len(d), flush=True)
              pd.concat(out).to_csv(f, index=False)
          pd.concat(out).to_csv(f, index=False); print("total", s, sum(len(x) for x in out), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: era5-${{ strategy.job-index }}
          path: salida/
